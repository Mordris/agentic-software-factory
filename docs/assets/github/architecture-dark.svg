<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Factory architecture — proposed runtime</title><desc id="desc">You talk to Headquarters. A coordinator owns task state, authority and evidence; the web Headquarters follows its events. Seven specialist labs execute bounded work. External actions require a separate exact approval. The runtime is not implemented.</desc>
