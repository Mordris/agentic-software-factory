changelog:
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Security
      labels: ["type:security"]
    - title: Features
      labels: ["type:feature"]
    - title: Fixes
      labels: ["type:bug"]
    - title: Documentation
      labels: ["type:docs"]
    - title: Maintenance and dependencies
      labels: ["type:maintenance", dependencies]
    - title: Other changes
      labels: ["*"]
